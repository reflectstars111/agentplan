name: agent_os_flutter
description: "Agent-OS Desktop Console — Von Neumann-inspired Multi-Agent Runtime"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.0

  # HTTP client
  dio: ^5.4.0

  # Local database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Routing
  go_router: ^14.0.0

  # UI
  flutter_markdown: ^0.7.0
  file_picker: ^8.0.0
  window_manager: ^0.4.0

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.16.0
  json_serializable: ^6.8.0
  freezed: ^2.5.0

flutter:
  uses-material-design: true
